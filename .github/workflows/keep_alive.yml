name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 6 */2 * *'
  workflow_dispatch:

jobs:
  ping:
    name: Ping Supabase
    runs-on: ubuntu-latest
    steps:
      - name: Health check
        env:
          SUPABASE_URL: ${{ secrets.KEEP_ALIVE }}
        run: |
          if [ -z "$SUPABASE_URL" ]; then
            echo "ERROR: Secret KEEP_ALIVE no configurado. Agrega la URL de Supabase como valor."
            exit 1
          fi

          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${SUPABASE_URL}/rest/v1/")

          echo "Supabase respondio con HTTP $STATUS"

          if [ "$STATUS" = "000" ] || [ "$STATUS" -ge 500 ]; then
            echo "El proyecto puede estar pausado o no disponible."
            exit 1
          fi

          echo "Proyecto activo (HTTP $STATUS)."
